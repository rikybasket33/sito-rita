<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" role="img" aria-label="A dotted route arcing from America across the ocean to a marked town in northern Italy">
  <defs>
    <linearGradient id="rm-italy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E2C886" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#C9A24B" stop-opacity="0.18"/>
    </linearGradient>
  </defs>

  <!-- Compass rose -->
  <g transform="translate(78 92)" opacity="0.7" stroke="currentColor" fill="none" stroke-width="2">
    <circle r="30"/>
    <circle r="19"/>
    <path d="M0 -42 L7 0 L0 42 L-7 0 Z M-42 0 L0 7 L42 0 L0 -7 Z" fill="currentColor" opacity="0.55" stroke="none"/>
  </g>

  <!-- Departure point (America) -->
  <g transform="translate(64 388)">
    <circle r="10" fill="currentColor"/>
    <circle r="10" fill="none" stroke="currentColor" stroke-width="2.5">
      <animate attributeName="r" values="10;24;10" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="38" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="19" fill="currentColor">America</text>
  </g>

  <!-- Dashed crossing route -->
  <path d="M76 378 C 190 200, 320 150, 392 232" fill="none" stroke="currentColor" stroke-width="3.5"
        stroke-linecap="round" stroke-dasharray="2 13" opacity="0.85"/>
  <!-- heart travelling the route -->
  <path d="M0 -9 C -7 -18 -20 -9 0 9 C 20 -9 7 -18 0 -9 Z" fill="#C0492C" stroke="#FFFBF3" stroke-width="1.5">
    <animateMotion dur="6s" repeatCount="indefinite" rotate="auto" path="M76 378 C 190 200, 320 150, 392 232"/>
  </path>

  <!-- ===== Italy ===== -->
  <g transform="translate(300 70) scale(0.92)">
    <g fill="url(#rm-italy)" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">
      <!-- Mainland (the boot) -->
      <path d="M150 20
               c -8 8 -10 18 -7 28 c 3 10 10 17 7 28 c -3 10 -13 14 -18 23
               c -6 11 -2 24 6 32 c 8 9 21 11 28 22 c 7 10 7 24 2 35
               c -5 12 -16 20 -21 33 c -4 10 -1 21 3 32 c 5 12 16 21 18 35
               c 2 11 -3 24 -11 33 c -10 11 -26 16 -36 28 c -10 12 -12 29 -5 42
               c 6 11 21 16 26 29 c 5 13 -3 29 -13 39 c -10 10 -25 15 -31 28
               c -6 13 -2 28 8 38 c 8 8 21 11 26 21 c 5 9 0 21 -8 27
               c -13 11 -32 14 -42 28 c -9 13 -4 31 8 40 c 11 8 25 10 32 21
               c 5 9 1 20 -6 27 c -13 14 -32 20 -41 37 c -9 17 -3 39 13 49
               c 14 9 33 9 49 18 c 15 8 28 24 24 41 c -4 18 -24 28 -41 24" />
      <!-- Puglia heel -->
      <path d="M198 392 c 23 -3 46 -5 68 -13 c 18 -6 33 -20 33 -39 c 0 -18 -18 -29 -36 -29 c -18 0 -36 10 -49 23" />
      <!-- Sicily -->
      <path d="M64 470 c 23 -10 49 -13 72 -6 c 18 5 33 18 36 36 c 3 18 -13 33 -30 38 c -20 6 -43 1 -60 -13 c -13 -10 -20 -28 -18 -43 z" />
      <!-- Sardinia -->
      <path d="M-12 300 c -13 20 -13 46 -3 68 c 10 19 31 32 52 28 c 20 -4 35 -24 35 -44 c 0 -20 -13 -41 -32 -50 c -18 -9 -41 -5 -52 -2 z" />
    </g>
  </g>

  <!-- Destination pin over northern-central Italy -->
  <g transform="translate(392 232)">
    <ellipse cx="0" cy="6" rx="14" ry="4" fill="#2B1F17" opacity="0.22"/>
    <path d="M0 0 C -17 -28 -24 -36 -24 -52 a24 24 0 0 1 48 0 C 24 -36 17 -28 0 0 Z" fill="#C0492C" stroke="#FFFBF3" stroke-width="2"/>
    <circle cx="0" cy="-52" r="10" fill="#FFFBF3"/>
    <circle cx="0" cy="-52" r="3.6" fill="#7A2E2E"/>
  </g>
  <text x="430" y="200" font-family="Georgia, serif" font-style="italic" font-size="20" fill="currentColor">Italia</text>
</svg>
